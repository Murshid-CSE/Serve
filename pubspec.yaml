name: community_care_hub
description: "Community Care Hub — One Platform. One Community. One Coordinated Workflow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.6.0
  connectivity_plus: ^7.2.0
  equatable: ^2.0.8
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_image_compress: ^2.3.0
  flutter_map: ^8.3.0
  flutter_riverpod: ^2.6.1
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^6.2.1
  http: ^1.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  percent_indicator: ^4.2.3
  permission_handler: ^12.0.3
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: any
  fake_cloud_firestore: any
  firebase_auth_mocks: any
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: any
  integration_test:
    sdk: flutter
  json_serializable: any
  mocktail: any
  shared_preferences_platform_interface: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
